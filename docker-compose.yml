version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: powermedia-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: photo_gallery
      MYSQL_USER: gallery
      MYSQL_PASSWORD: gallery
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: powermedia-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: photo_gallery
      MYSQL_USER: gallery
      MYSQL_PASSWORD: gallery
    working_dir: /var/www/html

volumes:
  db_data:
