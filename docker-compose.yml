version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: gallery-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: photo_gallery
      MYSQL_USER: gallery
      MYSQL_PASSWORD: gallery
      # Speed up initial startup
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s
      interval: 10s

  app:
    build: .
    container_name: gallery-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      # Database connection (auto-used by bootstrap-config.php)
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: photo_gallery
      MYSQL_USER: gallery
      MYSQL_PASSWORD: gallery
      # Site configuration (optional; edit in /admin/setup after first login)
      GALLERY_NAME: "Photo Gallery"
      GALLERY_BASE_URL: "http://localhost:8080"
      GALLERY_CURRENCY: "GBP"
    working_dir: /var/www/html

volumes:
  db_data:
